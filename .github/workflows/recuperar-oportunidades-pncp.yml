name: Recuperar UFs pendentes do PNCP

# Executa uma recuperação leve entre as coletas completas. Nunca disputa escrita
# com o robô principal: se ele estiver ativo, esta execução aguarda a vez.
concurrency:
  group: atualizar-dados-pncp
  cancel-in-progress: false

on:
  schedule:
    # Antes rodava de hora em hora (24 pushes/dia possiveis pro main, cada um disparando
    # um deploy completo no Netlify e consumindo credito de build). Espacado pra a cada 3h
    # (8x/dia) - ainda cobre bem o dia sem gerar deploy toda hora. Ver Segundo-Cerebro
    # /03-Bugs-Conhecidos.md sobre o consumo de credito do Netlify.
    # Em 18/11 a grade "17 */3" caía às 21:17 UTC, dentro do boletim das 21:00 (seg-sex),
    # que consulta o mesmo /contratacoes/proposta. "17 2-23/3" (02,05,...,20,23h) termina
    # antes de 09:00, 10:00, 16:00 e 21:00 UTC, horários do robô principal e do boletim.
    - cron: "17 2-23/3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  recuperar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Recuperar somente UFs pendentes
        env:
          SOMENTE_OPORTUNIDADES: "1"
          RECUPERAR_UFS_PENDENTES: "1"
          LIMITE_MINUTOS_OPORTUNIDADES: "28"
          # A taxa é a cadência global: o PNCP aceita ~20 chamadas/min por origem (medido
          # 23/11). Com 900 ms, os 429 em série pausavam todos e a rodada fazia ~14 UFs.
          CONCORRENCIA_UF_OPORTUNIDADES: "3"
          INTERVALO_MS_OPORTUNIDADES: "3000"
          MIN_UFS_OK_OPORTUNIDADES: "1"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/atualizar_dados.js
      # Pausado em 08/10/2026: cada dossiê chama o GPT-5.1 pelo AI Gateway da Netlify (~40
      # créditos por edital) e o robô resumia editais fora dos boletins. Remover este `if`
      # só depois que a geração tiver teto de gasto e fila restrita aos boletins.
      - name: Preparar dossiês recém-coletados
        if: ${{ false }}
        env:
          LICITAPLENA_URL: "https://licitaplena.com.br"
          # A recuperação é a rota de entrada dos editais durante o dia. Preparar
          # aqui elimina a espera de uma coleta diária para o primeiro clique.
          MAX_DOSSIES_POR_EXECUCAO: "120"
          DIAS_PUBLICACAO_DOSSIE: "30"
          CONCORRENCIA_DOSSIES: "3"
          # Job tem 35 min no total e o passo de coleta já reserva até 28 min: orçamento
          # curto aqui evita estourar o timeout do job e derrubar o commit/push final.
          LIMITE_MINUTOS_DOSSIES: "5"
          REPROCESSAR_PARCIAL_APOS_HORAS: "24"
          DOSSIES_EDITAIS_CHAVE: ${{ secrets.DOSSIES_EDITAIS_CHAVE }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$DOSSIES_EDITAIS_CHAVE" ]; then
            echo "DOSSIES_EDITAIS_CHAVE não configurada; preparação antecipada aguardará a configuração do segredo."
            exit 0
          fi
          node scripts/preparar_dossies_editais.js

      - name: Registrar sucesso na Saúde do sistema (admin)
        if: success()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/registrar_robo.js ufs
