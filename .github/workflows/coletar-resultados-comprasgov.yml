name: Coletar resultados públicos do Compras.gov

on:
  schedule:
    # 10:30 UTC, fora do pico da coleta PNCP; o cursor retoma automaticamente.
    - cron: "30 10 * * *"
  workflow_dispatch: {}

concurrency:
  group: coletar-resultados-comprasgov
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    # O limite interno de 18 min preserva margem para encerrar e salvar o cursor.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Coletar e normalizar resultados homologados
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIMITE_MINUTOS: "18"
          DIAS_INICIAIS: "365"
          FOLGA_DIAS: "2"
          TAMANHO_PAGINA: "100"
          ATRASO_MS: "350"
          INTERVALO_MS: "900"
          PAUSA_429_MS: "15000"
          CONCORRENCIA_ITENS: "1"
          # 500 linhas por upsert estouravam o statement_timeout (57014) desde 12/11.
          TAMANHO_LOTE_BANCO: "100"
          LOTE_MINIMO_BANCO: "10"
        run: node scripts/coletar_comprasgov_resultados.js
