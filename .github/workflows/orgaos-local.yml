name: Local dos órgãos (PNCP)

# Catálogo de órgãos (supabase/orgaos_navegacao.sql): o cadastro do PNCP não traz UF nem cidade, então órgão que só está
# no cadastro não aparece na lista por estado de orgao.html. Este robô consulta as unidades de cada órgão sem UF no PNCP
# no ritmo que o PNCP aceita (20 chamadas/min) por 50 min e continua de onde parou. A 1ª passada (~98 mil órgãos) leva ~4 dias;
# depois só entram os órgãos novos (sai em segundos). Também recarrega o cadastro semanal se o atualizar-dados não o fez.
on:
  schedule:
    # De hora em hora (repositório público: Actions sem custo). Uma rodada por vez (concurrency abaixo).
    - cron: "10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: orgaos-local
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: UF e cidade dos órgãos pelas unidades do PNCP
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CADASTRO_ORGAOS_LOCAL_MINUTOS: "50"
          CADASTRO_ORGAOS_INTERVALO_MS: "3000"
          CADASTRO_ORGAOS_CONCORRENCIA: "2"
        run: node scripts/atualizar_cadastro_orgaos.js
