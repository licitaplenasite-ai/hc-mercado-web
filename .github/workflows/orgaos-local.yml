name: Local dos órgãos (PNCP)

# Catálogo de órgãos (supabase/orgaos_navegacao.sql): o cadastro do PNCP não traz UF nem cidade, então órgão que só está
# no cadastro não aparece na lista por estado de orgao.html. Este robô consulta as unidades de cada órgão sem UF no PNCP
# (~0,5 s por órgão) por 20 min e continua de onde parou na rodada seguinte. A 1ª passada (~98 mil órgãos) leva ~1-2 dias;
# depois só entram os órgãos novos (sai em segundos). Também recarrega o cadastro semanal se o atualizar-dados não o fez.
on:
  schedule:
    # 5 vezes por dia, a cada 4 h, pulando o horário do atualizar-dados (09:00 UTC = 06:00 de Brasília).
    - cron: "30 1,5,13,17,21 * * *"
  workflow_dispatch: {}

concurrency:
  group: orgaos-local
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: UF e cidade dos órgãos pelas unidades do PNCP
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CADASTRO_ORGAOS_LOCAL_MINUTOS: "20"
          CADASTRO_ORGAOS_CONCORRENCIA: "6"
        run: node scripts/atualizar_cadastro_orgaos.js
