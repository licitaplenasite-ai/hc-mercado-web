name: Lembretes de licitação

on:
  schedule:
    # De hora em hora: o usuário escolhe a hora do aviso (horário de Brasília). O script avisa o que já
    # passou do momento e ainda não venceu, então um atraso do GitHub não perde lembrete.
    - cron: "0 * * * *"
  workflow_dispatch: {}

# Uma rodada por vez: duas simultâneas enviariam o mesmo lembrete duas vezes.
concurrency:
  group: lembretes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lembretes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verificar lembretes e enviar e-mails
        env:
          # ZeptoMail (o mesmo token do site); sem ele o script cai no Gmail SMTP abaixo.
          ZEPTOMAIL_TOKEN: ${{ secrets.ZEPTOMAIL_TOKEN }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/lembretes_licitacoes.py

      # Prazos e certidões no celular (scripts/avisos_celular.js; node já vem no ubuntu-latest). Sem as chaves VAPID sai sem erro.
      - name: Avisos no celular
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_CHAVE_PUBLICA: ${{ secrets.VAPID_CHAVE_PUBLICA }}
          VAPID_CHAVE_PRIVADA: ${{ secrets.VAPID_CHAVE_PRIVADA }}
        run: node scripts/avisos_celular.js

      - name: Registrar sucesso na Saúde do sistema (admin)
        if: success()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/registrar_robo.js lembretes
