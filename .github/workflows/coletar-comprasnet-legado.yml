name: Coletar ComprasNet Legado (Fase 1)

on:
  schedule:
    # 12:00 UTC = 09:00 no horário de Brasília — depois dos outros robôs
    - cron: "0 12 * * *"
  workflow_dispatch: {}

# cancel-in-progress: false (nunca cancelar, só enfileirar): duas execuções
# escrevendo ao mesmo tempo no mesmo clone/push é a causa mais provável de
# um push falhar por causa de mudança concorrente no repositório remoto — e
# cancelar uma execução em andamento no meio de uma coleta descartaria
# trabalho já feito. Enfileirar é mais seguro que as duas rodarem juntas.
concurrency:
  group: coletar-comprasnet-legado
  cancel-in-progress: false

# contents: read (não write) porque este workflow não grava nada no
# repositório hc-mercado-web — só lê o código. A escrita acontece no
# repositório de dados históricos, separado, via o token DADOS_HISTORICOS_TOKEN
# usado no clone/push abaixo.
permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    # 20 min = clone do repositório de dados + orçamento interno do robô
    # (LIMITE_MINUTOS=12) + commit/push. A folga entre 12 e 20 é o que protege
    # o cursor de progresso de um SIGKILL por timeout do job.
    timeout-minutes: 20
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      # Mesmo padrão do passo "Publicar dados privados no painel interno" de
      # .github/workflows/atualizar-dados.yml: clone raso do repositório de
      # dados privado, o robô escreve arquivos locais nele, e o passo final
      # commita e envia tudo de uma vez. Evita o teto de ~1 MB por arquivo e o
      # rate limit secundário da API de Contents do GitHub.
      - name: Clonar repositório de dados históricos
        env:
          DADOS_HISTORICOS_TOKEN: ${{ secrets.DADOS_HISTORICOS_TOKEN }}
        run: |
          set -e
          if [ -z "$DADOS_HISTORICOS_TOKEN" ]; then
            echo "DADOS_HISTORICOS_TOKEN não configurado — impossível coletar."
            exit 1
          fi
          rm -rf /tmp/dados-historicos-comprasnet
          REMOTE="https://harresoncoelho-lang:${DADOS_HISTORICOS_TOKEN}@github.com/harresoncoelho-lang/hc-licitacoes-dados-historicos.git"
          AJUDA="Gere um token novo (fine-grained) na conta harresoncoelho-lang, só no repositório hc-licitacoes-dados-historicos, com Contents: Read and write, e cole em Settings > Secrets and variables > Actions > DADOS_HISTORICOS_TOKEN deste repositório."
          # Falha cedo, antes de gastar 12 min coletando: leitura (ls-remote) e escrita (push --dry-run, que
          # autentica no git-receive-pack sem enviar nada). 23/11/2026: token sem acesso derrubava só o push final.
          git ls-remote "$REMOTE" HEAD > /dev/null || {
            echo "::error::DADOS_HISTORICOS_TOKEN sem acesso de leitura a hc-licitacoes-dados-historicos (vencido, revogado ou sem o repositório). $AJUDA"
            exit 1
          }
          git clone --depth 1 "$REMOTE" /tmp/dados-historicos-comprasnet
          cd /tmp/dados-historicos-comprasnet
          if git rev-parse -q --verify HEAD > /dev/null; then
            git push --dry-run "$REMOTE" HEAD:main > /dev/null || {
              echo "::error::DADOS_HISTORICOS_TOKEN lê mas não consegue gravar em hc-licitacoes-dados-historicos. $AJUDA"
              exit 1
            }
          fi

      # CURSOR_PENDENTE: o robô deixa o cursor novo neste arquivo (fora do clone, para não ir no commit) em vez de
      # gravar no Supabase; o último passo só o confirma se o push deu certo.
      - name: Rodar robô de coleta ComprasNet Legado
        env:
          DADOS_HISTORICOS_DIR: /tmp/dados-historicos-comprasnet
          CURSOR_PENDENTE: /tmp/comprasnet_cursor_pendente.json
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/coletar_comprasnet_legado.js

      # if: always() de propósito: se o robô morrer no meio (exceção ou
      # timeout do job), o cursor de progresso já pode ter avançado, então o
      # que ele alcançou a gravar em disco precisa ser enviado mesmo assim —
      # senão abre um buraco no histórico. Reenviar registro repetido é
      # inofensivo (dedup por idCompra na leitura/merge).
      #
      # O push tem retry com fetch+rebase. O cursor de progresso só vai pro
      # Supabase no passo seguinte, e só se este passo terminar com sucesso:
      # push que falha de vez deixa o cursor onde estava, e a próxima execução
      # coleta de novo as mesmas páginas (reenviar registro repetido é
      # inofensivo, dedup por idCompra) em vez de pular dados nunca enviados.
      - name: Commitar e enviar dados históricos
        id: enviar
        if: always()
        env:
          DADOS_HISTORICOS_TOKEN: ${{ secrets.DADOS_HISTORICOS_TOKEN }}
        run: |
          set -e
          if [ ! -d /tmp/dados-historicos-comprasnet/.git ]; then
            echo "Clone do repositório de dados não existe — nada a enviar."
            exit 0
          fi
          cd /tmp/dados-historicos-comprasnet
          git config user.name "hc-licitacoes-bot"
          git config user.email "actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados históricos hoje."
            exit 0
          fi
          git commit -m "Atualização automática ComprasNet Legado - $(date -u +'%Y-%m-%d %H:%M UTC')"

          REMOTE="https://harresoncoelho-lang:${DADOS_HISTORICOS_TOKEN}@github.com/harresoncoelho-lang/hc-licitacoes-dados-historicos.git"
          sucesso=0
          for tentativa in 1 2 3 4 5; do
            if git push "$REMOTE" HEAD:main; then
              sucesso=1
              break
            fi
            echo "git push falhou (tentativa $tentativa/5)."
            if [ "$tentativa" -lt 5 ]; then
              sleep 10
              # fetch/rebase são best-effort, nunca podem derrubar o script (set -e
              # mataria o loop inteiro na primeira falha sem o || true): na primeira
              # execução de sempre o repositório remoto ainda não tem nenhum commit
              # (sem ref "main" pra buscar), e numa falha de permissão o fetch falha
              # pelo mesmo motivo do push — nos dois casos não há nada pra rebasear,
              # e a tentativa seguinte de "git push" já reporta o erro real de novo.
              git fetch "$REMOTE" main || true
              git rebase FETCH_HEAD 2>/dev/null || { git rebase --abort 2>/dev/null || true; }
            fi
          done
          if [ "$sucesso" -ne 1 ]; then
            echo "::error::Falha ao enviar dados históricos após 5 tentativas. O cursor de progresso NÃO avançou: a próxima execução coleta de novo estas páginas. Se o erro for de autenticação, renove o DADOS_HISTORICOS_TOKEN (Contents: Read and write em hc-licitacoes-dados-historicos)."
            exit 1
          fi

      - name: Confirmar cursor de progresso no Supabase
        if: always() && steps.enviar.outcome == 'success'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/coletar_comprasnet_legado.js --confirmar-cursor /tmp/comprasnet_cursor_pendente.json
