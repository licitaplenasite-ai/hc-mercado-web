name: Estudo de obras (quem ganha e quem perde)

# Robô semanal (scripts/estudo_obras.js): lê os dados abertos do Compras.gov (repositório de propostas e compras do
# PNCP, atualizados aos domingos às 8h e 9h) e recalcula as estatísticas das concorrências de obra: desconto do
# vencedor, quantas mais baratas caíram antes dele e situação das propostas, por UF, tipo de obra e faixa de valor.
# Segunda às 13:00 UTC (10h de Brasília). Só baixa de novo quando algum arquivo mudou. Sem CNPJ nem nome no banco.
# Também coleta os motivos de recusa do chat, se o dono ligou a coleta (desligada por padrão).
# Falha de fonte ou formato: o job falha (e-mail do GitHub) e o motivo fica em dados_robo "estudo_obras_estado".
# Precisa de supabase/orcamento_estudo.sql aplicado antes.
# Carga inicial (uma vez, na nuvem, sem a máquina do dono): Actions > este workflow > Run workflow com semente=1.
# Carrega scripts/sementes/amostra-obras-20261122.csv (amostra do estudo de 22/11, com disputas de 2023 em diante,
# mais antigas que os 18 meses que o robô relê) e recalcula as estatísticas. É a amostra de _historico/orcamentista
# sem órgão, município, número PNCP e nome do vencedor: o repositório é público e o banco do estudo não guarda nome.
# Rodar de novo é seguro: a semente nunca sobrescreve disputa já coletada pelo robô.
concurrency:
  group: estudo-obras
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      semente:
        description: "1 = só carrega a amostra do estudo de 22/11 (carga inicial) e recalcula"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  estudar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - run: npm ci
      - name: Atualizar o estudo
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ESTUDO_MESES: "18"
          LIMITE_MINUTOS: "28"
          SEMENTE: ${{ github.event.inputs.semente || '' }}
        run: |
          if [ "$SEMENTE" = "1" ]; then node scripts/estudo_obras.js --semente scripts/sementes/amostra-obras-20261122.csv
          else node scripts/estudo_obras.js; fi
