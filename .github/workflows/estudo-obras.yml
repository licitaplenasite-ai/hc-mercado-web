name: Estudo de obras (quem ganha e quem perde)

# Robô semanal (scripts/estudo_obras.js): lê os dados abertos do Compras.gov (repositório de propostas e compras do
# PNCP, atualizados aos domingos às 8h e 9h) e recalcula as estatísticas das concorrências de obra: desconto do
# vencedor, quantas mais baratas caíram antes dele e situação das propostas, por UF, tipo de obra e faixa de valor.
# Segunda às 13:00 UTC (10h de Brasília). Só baixa de novo quando algum arquivo mudou. Sem CNPJ nem nome no banco.
# Também coleta os motivos de recusa do chat, se o dono ligou a coleta (desligada por padrão).
# Falha de fonte ou formato: o job falha (e-mail do GitHub) e o motivo fica em dados_robo "estudo_obras_estado".
# Precisa de supabase/orcamento_estudo.sql aplicado antes. Carga inicial (uma vez, local):
#   node scripts/estudo_obras.js --semente _historico/orcamentista/amostra-obras-comprasgov.csv
concurrency:
  group: estudo-obras
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  estudar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: npm ci
      - name: Atualizar o estudo
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ESTUDO_MESES: "18"
          LIMITE_MINUTOS: "28"
        run: node scripts/estudo_obras.js
