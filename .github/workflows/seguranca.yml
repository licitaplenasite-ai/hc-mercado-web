name: Varredura de segurança

# Varredura contínua grátis (segredos, código e dependências). Fase 1: só AVISA.
# Cada job tem continue-on-error: um achado aparece como aviso na aba Actions e não trava
# nada; a publicação (publicar-cloudflare.yml) é outro workflow e não depende deste.
# Para virar trava depois (ver SECURITY.md): tirar o continue-on-error do job e marcar o
# check como obrigatório na proteção da branch main.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 9 * * *" # todo dia 06:17 (Brasília): roda inteira ao menos 1x/dia, mesmo sem commit
  workflow_dispatch: {}

permissions:
  contents: read

# Grupo por evento: push seguido cancela o push anterior, mas nunca a rodada diária do cron.
concurrency:
  group: seguranca-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  segredos:
    name: Segredos no histórico (gitleaks)
    runs-on: ubuntu-latest
    # 23/11/2026: 48 de 48 rodadas canceladas por este timeout (10 min), não por concurrency: o histórico tem
    # dezenas de versões de data/*.json de 15-22 MB (antes de irem para o Supabase) e o gitleaks travava nelas.
    # Com --max-target-megabytes 2 o histórico inteiro (964 commits) leva ~3 min.
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico inteiro: chave apagada do arquivo continua nos commits antigos
          persist-credentials: false
      # Imagem oficial com versão fixa; --redact nunca imprime o valor do segredo no log.
      # shortcut: pula arquivo > 2 MB (os JSON antigos de dados públicos do PNCP); se um dia entrar arquivo grande com
      # segredo possível, varrer ele à parte.
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose --max-target-megabytes 2

  codigo:
    name: Código (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    container:
      image: semgrep/semgrep:1.140.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Regras públicas do registro do Semgrep, sem login e sem enviar o código (metrics=off).
      # Pastas ignoradas ficam em .semgrepignore.
      - name: semgrep
        run: >-
          semgrep scan --metrics=off --error
          --config p/javascript --config p/nodejs --config p/owasp-top-ten --config p/secrets

  dependencias:
    name: Dependências (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      # Produção (o que vai para o site e as funções): falha a partir de "moderate".
      - name: npm audit (produção)
        run: npm audit --omit=dev --audit-level=moderate
      # Ferramentas de desenvolvimento (eslint, playwright...): só avisa a partir de "high".
      - name: npm audit (desenvolvimento)
        run: npm audit --audit-level=high
