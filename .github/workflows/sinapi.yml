name: SINAPI (preços de insumos e composições da CAIXA)

# Robô mensal da tela SINAPI (scripts/coletar_sinapi.js): baixa da CAIXA (grátis, sem login, sem captcha) o ZIP
# da referência mais recente (~16 MB, todas as UFs) e grava sinapi_itens, sinapi_custos (27 UFs, desonerado e
# não desonerado) e sinapi_composicao_itens (composições analíticas).
# A CAIXA publica por volta do dia 10 a 15 do mês seguinte; roda dia 16 e dia 25 às 12:00 UTC (9h de Brasília)
# para pegar atraso e retificação. Rodar de novo é seguro (upsert + limpeza da referência anterior).
# Também grava o histórico por data-base (bases_preco_*, 24 meses), confere retificação dos meses anteriores e
# recusa referência zerada (falha = e-mail do GitHub + estado em dados_robo "bases_preco_saude").
# Não escreve no repositório: só no Supabase. Precisa de supabase/sinapi_todas_ufs.sql e bases_preco.sql aplicados.
# Carregar meses antigos no histórico: Run workflow com referencia=AAAA-MM e so_historico=1 (um mês por vez).
# Rota reserva (o WAF da CAIXA barra o robô com 429/403, como em 23/11/2026): alguém baixa o ZIP no navegador em
# caixa.gov.br/sinapi, cria um Release neste repositório com a tag sinapi-AAAA-MM e o ZIP anexado SEM renomear, e
# roda este workflow com arquivo_release=sinapi-AAAA-MM. O job baixa o anexo com o GITHUB_TOKEN (só leitura) e o
# robô lê o arquivo em vez de falar com a CAIXA; o resto do fluxo é o mesmo. A base fica no Supabase: nada depende
# da máquina de ninguém nem do portal da CAIXA no ar na hora do orçamento.
# Falha (download, arquivo errado, zerado, banco) nunca apaga a referência gravada: ver cabeçalho do script.
concurrency:
  group: sinapi
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 12 16,25 * *"
  workflow_dispatch:
    inputs:
      ufs:
        description: "UFs separadas por vírgula (vazio = todas as 27)"
        required: false
        default: ""
      referencia:
        description: "Mês AAAA-MM (vazio = mais recente publicado)"
        required: false
        default: ""
      so_historico:
        description: "1 = só grava o histórico do mês (não troca a referência vigente)"
        required: false
        default: ""
      arquivo_release:
        description: "Rota reserva: tag do Release com o ZIP oficial anexado (ex.: sinapi-2026-10). Vazio = baixa da CAIXA"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - run: npm ci
      - name: Baixar o ZIP anexado ao Release (rota reserva)
        if: github.event.inputs.arquivo_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.arquivo_release }}
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Tag inválida: $TAG"; exit 1; }
          pasta="$RUNNER_TEMP/sinapi"; mkdir -p "$pasta"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'SINAPI-*-formato-xlsx*.zip' --dir "$pasta"
          arquivos=("$pasta"/*.zip)
          [ "${#arquivos[@]}" = 1 ] || { echo "::error::O Release $TAG precisa ter exatamente 1 ZIP SINAPI-AAAA-MM-formato-xlsx*.zip (achei ${#arquivos[@]})."; exit 1; }
          ls -l "${arquivos[0]}"
          echo "SINAPI_ARQUIVO=${arquivos[0]}" >> "$GITHUB_ENV"
      # Mês ainda não publicado ou WAF da CAIXA barrando o runner: o robô sai 0 com ::warning:: e indisponivel=1
      # (a referência gravada continua valendo); aí o batimento abaixo não é gravado. Erro de verdade continua vermelho.
      - name: Coletar SINAPI
        id: coletar
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SINAPI_UFS: ${{ github.event.inputs.ufs || '' }}
          SINAPI_REFERENCIA: ${{ github.event.inputs.referencia || '' }}
          SINAPI_SO_HISTORICO: ${{ github.event.inputs.so_historico || '' }}
          BASES_RETENCAO_MESES: "24"
        run: node scripts/coletar_sinapi.js

      - name: Registrar sucesso na Saúde do sistema (admin)
        if: success() && steps.coletar.outputs.indisponivel != '1'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/registrar_robo.js bases_obra
