name: Boletim diario de editais

on:
  schedule:
    # Roda 3x ao dia, no horario de Brasilia (UTC-4, sem horario de verao):
    - cron: "0 10 * * 1-5"  # 06:00 Brasilia (antecipado para chegar por volta das 7h-8h, ja compensando o atraso normal de fila do GitHub Actions)
    - cron: "0 16 * * 1-5"  # 12:00 Brasilia
    - cron: "0 21 * * 1-5"  # 17:00 Brasilia
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  boletim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install holidays

      - name: Rodar boletim de editais
        env:
          # ZeptoMail (o mesmo token dos lembretes e do site); sem ele, ou se falhar, cai no Gmail SMTP abaixo.
          ZEPTOMAIL_TOKEN: ${{ secrets.ZEPTOMAIL_TOKEN }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/boletim_editais.py
        # O historico de editais ja vistos agora vai direto pro Supabase (tabela
        # dados_robo) em vez de data/editais_vistos.json commitado no git - assim
        # essa execucao nao dispara mais uma publicacao completa do site no Netlify
        # (isso rodava 3x/dia, era a maior fatia dos disparos automaticos).
