name: Prospecção (PCA, IRP, atas para adesão, contratos vencendo)

# Robô da tela Prospecção (scripts/coletar_prospeccao.js): lê PNCP e Compras.gov dados abertos (grátis, sem login,
# sem captcha) e grava a tabela enxuta prospeccao_itens. As 27 UFs ficam em 3 grupos (um job da matriz cada, com
# progresso próprio em dados_robo/prospeccao_estado_<grupo>). Cada rodada pega a etapa (UF:contrato, UF:ata, UF:pca)
# pela metade ou a mais antiga e retoma de onde a anterior parou; etapa fechada há menos de 36 h fica de fora, então
# com tudo em dia a rodada só confere e sai. A IRP (nacional) roda só no grupo 1.
# Até 22/11 era só o AM, com progresso "do dia": o tempo acabava nas atas e o PCA nunca era coletado.
# Rodadas de até 150 min a cada 3 h: o primeiro ciclo do Brasil todo leva alguns dias (ver
# _historico/prospeccao-conserto-20261122.md); depois cada UF volta a cada ~36-48 h.
# Não escreve no repositório: só no Supabase. Precisa de supabase/prospeccao.sql (v3) aplicado antes.
on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      ufs:
        description: "UFs separadas por vírgula (opcional; roda só o grupo 1 com essas UFs)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          # Grupos equilibrados pelo volume de atas e contratos (SP, MG e RJ/RS em grupos diferentes).
          - grupo: g1
            ufs: SP,BA,PA,ES,AM,PB,AL,RO,AP
            irp: "1"
          - grupo: g2
            ufs: MG,PR,PE,DF,MT,MA,RN,SE,AC
            irp: "0"
          - grupo: g3
            ufs: RJ,RS,SC,GO,CE,MS,PI,TO,RR
            irp: "0"
    concurrency:
      group: prospeccao-${{ matrix.grupo }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - run: npm ci
      - name: Coletar prospecção
        # Disparo manual com UFs: só o grupo 1 roda (com o progresso dele); os outros saem sem coletar.
        if: ${{ !inputs.ufs || matrix.grupo == 'g1' }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROSPECCAO_GRUPO: ${{ matrix.grupo }}
          PROSPECCAO_UFS: ${{ inputs.ufs || matrix.ufs }}
          PROSPECCAO_IRP: ${{ matrix.irp }}
          DIAS_HORIZONTE: "400"
          PAUSA_MS: "300"
          LIMITE_MINUTOS: "150"
          FRESCOR_HORAS: "36"
          LIMITE_HORAS_SEM_COBERTURA: "48"
          ADESOES_POR_RODADA: "1500"
        run: node scripts/coletar_prospeccao.js

      - name: Registrar sucesso na Saúde do sistema (admin)
        if: success()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/registrar_robo.js prospeccao
