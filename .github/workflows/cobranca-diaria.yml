name: Cobrança diária

on:
  schedule:
    # 11:00 UTC = 08:00 de Brasília: bloqueia quem passou da carência e manda os lembretes de vencimento.
    - cron: "0 11 * * *"
  workflow_dispatch: {}

concurrency:
  group: cobranca
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cobranca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Bloqueios e lembretes de cobrança
        env:
          ZEPTOMAIL_TOKEN: ${{ secrets.ZEPTOMAIL_TOKEN }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/cobranca_diaria.py

      - name: Registrar sucesso na Saúde do sistema (admin)
        if: success()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/registrar_robo.js cobranca
