name: Cobrança diária

on:
  schedule:
    # 11:00 UTC = 08:00 de Brasília: bloqueia quem passou da carência e manda os lembretes de vencimento.
    - cron: "0 11 * * *"
  workflow_dispatch: {}

concurrency:
  group: cobranca
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cobranca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Bloqueios e lembretes de cobrança
        env:
          ZEPTOMAIL_TOKEN: ${{ secrets.ZEPTOMAIL_TOKEN }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/cobranca_diaria.py
