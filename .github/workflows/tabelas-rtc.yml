name: Copiar tabela oficial da Reforma (cClassTrib)

on:
  schedule:
    # 08:20 UTC = 05:20 no horario de Brasilia. 3 GETs com pausa; so regrava quando a versao oficial muda.
    - cron: "20 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Copiar tabela de classificacao tributaria
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RTC_PAUSA_MS: "3000"
        run: node scripts/copiar_tabelas_rtc.js
