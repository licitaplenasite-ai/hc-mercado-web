<style>
/* Menu único da casca (25/11, dono: "menu lateral é FIXO, parado, igual ao Effecti"): um só elemento, desenhado aqui uma
   vez, nunca redesenhado nem rolado pelo código; a troca de tela só move a marca do item ativo. Sem transição. */
:root{--casca-menu:232px}
:root.menu-recolhido{--casca-menu:64px}
html,body{margin:0;height:100%;overflow:hidden;background:#f4f7fb;font:14px Inter,Arial,sans-serif}
[data-theme="dark"] body{background:#0a121c}
.casca-tela{position:fixed;top:0;bottom:0;left:var(--casca-menu);width:calc(100% - var(--casca-menu));height:100%;border:0;visibility:hidden;background:transparent}
.casca-tela.ativa{visibility:visible}
#casca-menu{position:fixed;top:0;left:0;bottom:0;z-index:5;width:var(--casca-menu);box-sizing:border-box;display:flex;flex-direction:column;gap:2px;padding:10px 8px 12px;background:#0A1B4F;border-right:1px solid #16307a;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#2a4592 transparent}
#casca-menu a,#casca-menu button{display:flex;align-items:center;gap:10px;flex-shrink:0;min-height:32px;width:100%;box-sizing:border-box;margin:0;padding:5px 10px;border:0;border-radius:8px;background:none;color:#d6e2ff;font:500 14px/20px Inter,Arial,sans-serif;text-align:left;text-decoration:none;cursor:pointer}
#casca-menu a:hover,#casca-menu button:hover{background:rgba(255,255,255,.09);color:#fff}
/* Mesmo peso de letra do item comum: negrito no ativo mudava a quebra de linha (e a altura) de nomes longos. */
#casca-menu a.ativo{background:#22D3EE;color:#0A1B4F}
#casca-menu a:focus-visible,#casca-menu button:focus-visible{outline:2px solid #22D3EE;outline-offset:1px}
#casca-menu a.ativo:focus-visible{outline-color:#fff}
#casca-menu .nav-ico{width:22px;height:22px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
#casca-menu .icone-ph{width:1em;height:1em;fill:currentColor;flex:none}
#casca-menu .nav-externo-ico{width:14px;height:14px;margin-left:auto;opacity:.7}
#casca-menu .casca-marca{gap:8px;min-height:40px;margin-bottom:4px;color:#fff;font:700 16px/24px Inter,Arial,sans-serif;letter-spacing:-.01em}
#casca-menu .casca-marca:hover{background:none}
/* Logo livre, como no site público: sem placa, e branca sobre o marinho (igual ao tema escuro do site). */
.casca-placa{width:32px;height:32px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.casca-placa img{width:28px;height:28px;filter:brightness(0) invert(1)}
#casca-recolher{color:#9fb3e6!important;font-size:12px!important;border-bottom:1px solid #1d3784!important;border-radius:8px 8px 0 0!important;margin-bottom:4px!important}
:root.menu-recolhido #casca-menu{padding:10px 6px 12px}
:root.menu-recolhido #casca-menu a,:root.menu-recolhido #casca-menu button{justify-content:center;padding:5px 0}
:root.menu-recolhido #casca-menu .nav-label,:root.menu-recolhido #casca-menu .nav-externo-ico{display:none}
:root.menu-recolhido #casca-recolher .nav-ico{transform:scaleX(-1)}
#casca-gaveta-fundo{position:fixed;inset:0;z-index:4;background:rgba(0,0,0,.45)}
#casca-gaveta-fundo[hidden]{display:none}
/* Celular/tablet: o menu vira gaveta (aberta pelo botão "Menu" do topo de cada tela); as telas ocupam a largura toda. */
@media (max-width:768px){
  :root,:root.menu-recolhido{--casca-menu:0px}
  #casca-menu{width:min(280px,86vw);height:100vh;height:100dvh;bottom:auto;padding:16px 8px;visibility:hidden;transform:translateX(-105%);box-shadow:0 12px 32px rgba(0,0,0,.35)}
  #casca-menu.gaveta-aberta{visibility:visible;transform:none}
  #casca-menu a{min-height:44px;padding:8px 10px}
  #casca-recolher{display:none!important}
  :root.menu-recolhido #casca-menu a{justify-content:flex-start;padding:8px 10px}
  :root.menu-recolhido #casca-menu .nav-label{display:inline}
}
#casca-carregando{position:fixed;top:0;left:var(--casca-menu);height:3px;width:40%;background:#22d3ee;z-index:3;animation:casca-ir 1s ease-in-out infinite}
@keyframes casca-ir{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){#casca-carregando{animation:none;width:100%;opacity:.6}}
#casca-aviso{position:fixed;left:calc(50% + var(--casca-menu) / 2);bottom:16px;transform:translateX(-50%);z-index:4;display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:calc(100% - 32px);box-sizing:border-box;padding:10px 12px;border-radius:10px;background:#15253a;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#casca-aviso[hidden],#casca-carregando[hidden]{display:none}
#casca-aviso button{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid #fff;background:transparent;color:#fff;font:600 14px Inter,Arial,sans-serif;cursor:pointer}
#casca-aviso #casca-aviso-atualizar{background:#fff;color:#15253a}
#casca-aviso button:focus-visible{outline:2px solid #22d3ee;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media print{#casca-menu,#casca-gaveta-fundo,#casca-aviso,#casca-carregando,.casca-tela:not(.ativa){display:none}.casca-tela{left:0;width:100%}}
</style>
</head>
