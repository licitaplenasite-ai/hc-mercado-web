<style>
*{box-sizing:border-box}
body{margin:0;background:var(--surface-page);color:var(--text-primary);font:var(--text-body);font-family:var(--font-sans)}
main{max-width:880px;margin:0 auto;padding:24px 16px 64px}

<body data-sem-ajuda>
<main>
  <p><a href="painel.html">← Voltar ao painel</a></p>
  <h1>Guia de uso do LicitaPlena</h1>
  <p class="lp-dica" style="font:var(--text-body);margin-bottom:24px">Onde fica cada coisa e como usar, tela por tela. As imagens usam dados fictícios. Vídeos curtos em breve.</p>
  <div id="tutoriais"></div>
</main>
<script src="ajuda-ui.js"></script>
<script>
  document.getElementById("tutoriais").append(window.LicitaPlenaAjuda.listaTutoriais(location.hash, false));
  // Link direto para um tutorial (ajuda.html#tutorial-funil) abre e rola até ele.
  const alvo = location.hash && document.getElementById(location.hash.slice(1));
  if (alvo && alvo.tagName === "DETAILS") { alvo.open = true; alvo.scrollIntoView(); }
</script>
