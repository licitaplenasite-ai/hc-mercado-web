<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Resumo do processo — LicitaPlena</title>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="supabase-config.js"></script>
<!-- Resumo de 1 página para imprimir (resumo-processo.js). Sempre claro: é para papel. Aguarda aprovação do dono (visual). -->
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#eef2f7;color:#15253a;font:13px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  .barra{display:flex;gap:12px;justify-content:center;padding:12px}
  .barra button,.barra a{font:600 14px/1 inherit;padding:10px 16px;border-radius:8px;border:1px solid #071b70;background:#071b70;color:#fff;cursor:pointer;text-decoration:none}
  .barra a{background:#fff;color:#071b70}
  #resumo{width:210mm;min-height:297mm;margin:0 auto 24px;background:#fff;padding:12mm;box-shadow:0 2px 12px rgba(0,0,0,.12)}
  header{border-bottom:2px solid #071b70;margin-bottom:8px;padding-bottom:6px}
  h1{font-size:17px;margin:0 0 2px;line-height:1.25}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#071b70;margin:10px 0 4px;border-bottom:1px solid #d6e0ec;padding-bottom:2px}
  .gerado{color:#61738b;font-size:11px;margin:2px 0;overflow-wrap:anywhere}
  .duas{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}
  dt{color:#61738b}dd{margin:0;font-weight:600;overflow-wrap:anywhere}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th,td{text-align:left;padding:3px 6px;border-bottom:1px solid #e5ebf2;vertical-align:top;overflow-wrap:anywhere}
  th{color:#61738b;font-weight:600;white-space:nowrap}
  td:first-child,td:nth-child(3),td:nth-child(4){white-space:nowrap}
  ul{margin:0;padding-left:16px}
  .vazio{color:#61738b;margin:2px 0}
  .notas{white-space:pre-wrap;margin:0}
  @media (max-width:820px){#resumo{width:auto;min-height:0;margin:0 0 16px;padding:16px}.duas{grid-template-columns:1fr}}
  @page{size:A4;margin:10mm}
  @media print{body{background:#fff}.barra{display:none}#resumo{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}section{break-inside:avoid}}
</style>
</head>
<body>
<div class="barra"><button type="button" id="imprimir">Imprimir ou salvar em PDF</button><a href="sistema" id="voltar">Voltar ao processo</a></div>
<main id="resumo" aria-live="polite"><p class="vazio">Montando o resumo...</p></main>
<script src="resumo-processo.js"></script>
</body>
</html>
