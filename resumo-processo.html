<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Resumo do processo — LicitaPlena</title>
<link rel="icon" type="image/png" href="favicon.png?v=3"><link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="supabase-config.js"></script>
<!-- Resumo de 1 página para imprimir (resumo-processo.js). Sempre claro: é para papel. Aguarda aprovação do dono (visual). -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds-tokens.css">
<style>
  /* Paleta A por tokens (ds-tokens.css, sempre o tema claro: a página não define data-theme), 23/11. */
  *{box-sizing:border-box}
  body{margin:0;background:var(--surface-page);color:var(--text-primary);font:13px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  .barra{display:flex;gap:12px;justify-content:center;padding:12px}
  .barra button,.barra a{font:600 14px/1 inherit;padding:10px 18px;border-radius:999px;border:1px solid transparent;background:var(--destaque);color:var(--destaque-texto);cursor:pointer;text-decoration:none;transition:transform .2s ease,box-shadow .2s ease}
  .barra button{box-shadow:0 8px 18px -8px rgba(var(--destaque-rgb),.6)}
  .barra a{background:var(--surface-default);color:var(--marca-titulo);border-color:var(--marca-medio)}
  .barra button:hover,.barra a:hover{transform:translateY(-1px)}
  .barra :focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
  #resumo{width:210mm;min-height:297mm;margin:0 auto 24px;background:#fff;padding:12mm;box-shadow:var(--sombra-cartao-forte)}
  header{border-bottom:2px solid var(--marca-escuro);margin-bottom:8px;padding-bottom:6px}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:18px;margin:0 0 2px;line-height:1.25;color:var(--marca-escuro)}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--marca-escuro);margin:10px 0 4px;border-bottom:1px solid var(--border-default);padding-bottom:2px}
  .gerado{color:var(--text-secondary);font-size:11px;margin:2px 0;overflow-wrap:anywhere}
  .duas{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}
  dt{color:var(--text-secondary)}dd{margin:0;font-weight:600;overflow-wrap:anywhere}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th,td{text-align:left;padding:3px 6px;border-bottom:1px solid var(--border-default);vertical-align:top;overflow-wrap:anywhere}
  th{color:var(--text-secondary);font-weight:600;white-space:nowrap}
  td:first-child,td:nth-child(3),td:nth-child(4){white-space:nowrap}
  ul{margin:0;padding-left:16px}
  .vazio{color:var(--text-secondary);margin:2px 0}
  .notas{white-space:pre-wrap;margin:0}
  @media (max-width:820px){#resumo{width:auto;min-height:0;margin:0 0 16px;padding:16px}.duas{grid-template-columns:1fr}}
  @page{size:A4;margin:10mm}
  @media print{body{background:#fff}.barra{display:none}#resumo{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}section{break-inside:avoid}}
</style>
</head>
<body>
<div class="barra"><button type="button" id="imprimir">Imprimir ou salvar em PDF</button><a href="sistema" id="voltar">Voltar ao processo</a></div>
<main id="resumo" aria-live="polite"><p class="vazio">Montando o resumo...</p></main>
<script src="resumo-processo.js"></script>
</body>
</html>
